version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securemailscope-backend
    ports:
      - "8000:8000"
    environment:
      - SMS_ENV=production
      - SMS_LOG_LEVEL=INFO
      - SMS_MAX_UPLOAD_SIZE_MB=100
      - SMS_UPLOAD_DIR=/app/uploads
      - SMS_RULES_DIR=/app/rules
    volumes:
      - ./rules:/app/rules:ro
      - ./backend/uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: securemailscope-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
